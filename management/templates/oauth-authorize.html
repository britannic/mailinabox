<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ hostname }}</title>
<style>
  body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 14px; color: #333; background: #fff; margin: 0; }
  .title { margin: 1em; text-align: center; font-weight: 300; }
  .subtitle { margin: 2em; text-align: center; }
  .login { margin: 0 auto; max-width: 32em; padding: 0 1em; }
  .form-group { margin-bottom: 15px; display: flex; align-items: baseline; }
  .form-group label { flex: 0 0 25%; text-align: right; padding-right: 15px; font-weight: bold; }
  .form-group .field { flex: 1; }
  input[type=email], input[type=password], input[type=text] { width: 100%; box-sizing: border-box; padding: 6px 12px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
  .help-block { margin-top: 5px; font-size: 90%; color: #737373; }
  .actions { margin-left: 25%; padding-left: 15px; }
  button { padding: 6px 12px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; }
  .error { color: #a94442; text-align: center; margin: 1em; }
</style>
</head>
<body>
<h1 class="title">{{ hostname }}</h1>
{% if fatal_error %}
<p class="error">{{ fatal_error }}</p>
{% else %}
<p class="subtitle">Sign in to continue to {{ client_name }}.</p>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<div class="login">
  <form method="post">
    <div class="form-group">
      <label for="loginEmail">Email</label>
      <div class="field">
        <input name="email" type="email" id="loginEmail" placeholder="Email" value="{{ email }}">
      </div>
    </div>
    <div class="form-group">
      <label for="loginPassword">Password</label>
      <div class="field">
        <input name="password" type="password" id="loginPassword" placeholder="Password">
      </div>
    </div>
    {% if show_totp %}
    <div class="form-group">
      <label for="loginOtpInput">Code</label>
      <div class="field">
        <input name="totp_token" type="text" id="loginOtpInput" placeholder="6-digit code" autocomplete="off">
        <div class="help-block">Enter the six-digit code generated by your two factor authentication app.</div>
      </div>
    </div>
    {% endif %}
    <input type="hidden" name="binding" value="{{ binding }}">
    <input type="hidden" name="binding_expires" value="{{ binding_expires }}">
    <div class="actions">
      <button type="submit">Sign in</button>
    </div>
  </form>
</div>
{% endif %}
</body>
</html>
